<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>投資分析 Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 p-6">

  <h1 class="text-2xl font-bold mb-6">📊 投資健康分析 Dashboard</h1>

  <!-- KPI -->
  <div class="grid grid-cols-4 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">總損益</p>
      <h2 id="total" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">勝率</p>
      <h2 id="win_rate" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">盈虧比</p>
      <h2 id="pf" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">健康分數</p>
      <h2 id="score" class="text-xl font-bold">-</h2>
    </div>
  </div>

  <!-- 健康分數條 -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <p class="mb-2 text-gray-500">健康分數</p>
    <div class="w-full bg-gray-200 rounded-full h-4">
      <div id="scoreBar" class="h-4 rounded-full bg-blue-500" style="width:0%"></div>
    </div>
  </div>

  <!-- PnL Chart -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h3 class="mb-4 font-semibold">已實現損益（交易序列）</h3>
    <canvas id="pnlChart"></canvas>
  </div>

  <!-- Insights -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h3 class="mb-4 font-semibold">📌 分析建議</h3>
    <ul id="insights" class="list-disc pl-5 text-gray-700"></ul>
  </div>

<script>
fetch('./output.json')
  .then(res => res.json())
  .then(data => {

    const health = data.health;

    // KPI
    document.getElementById('total').innerText = health.total.toFixed(2);
    document.getElementById('win_rate').innerText = (health.win_rate * 100).toFixed(1) + "%";
    document.getElementById('pf').innerText = health.profit_factor.toFixed(2);
    document.getElementById('score').innerText = health.score;

    // Score bar
    document.getElementById('scoreBar').style.width = health.score + "%";

    // Insights（簡單規則）
    const insights = [];

    if (health.win_rate < 0.5) insights.push("⚠️ 勝率偏低");
    if (health.profit_factor < 1) insights.push("⚠️ 賺小賠大");
    if (health.score > 70) insights.push("✅ 整體表現穩健");

    const ul = document.getElementById('insights');
    insights.forEach(i => {
      const li = document.createElement('li');
      li.innerText = i;
      ul.appendChild(li);
    });

    // PnL Chart
    const pnlData = data.realized.map((x, i) => ({
      x: i,
      y: x.pnl
    }));

    const ctx = document.getElementById('pnlChart');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: pnlData.map(d => d.x),
        datasets: [{
          label: 'PnL',
          data: pnlData.map(d => d.y),
          borderWidth: 2
        }]
      }
    });

  })
  .catch(err => {
    console.error(err);
    alert("讀取資料失敗，請確認 GitHub Actions 是否已執行");
  });
</script>

</body>
</html>
