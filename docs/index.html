<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>投資分析 Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 p-6">

  <h1 class="text-2xl font-bold mb-6">📊 投資健康分析 Dashboard</h1>

  <!-- KPI -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">總損益</p>
      <h2 id="total" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">勝率</p>
      <h2 id="win_rate" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">盈虧比</p>
      <h2 id="pf" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">健康分數</p>
      <h2 id="score" class="text-xl font-bold">-</h2>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-gray-400">Max Drawdown</p>
      <h2 id="max_drawdown" class="text-xl font-bold">-</h2>
    </div>
  </div>

  <!-- 資產概況 -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h3 class="mb-4 font-semibold">資產概況</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-gray-50 p-4 rounded-lg">
        <p class="text-gray-400">投入成本</p>
        <h2 id="invested" class="text-xl font-bold">-</h2>
        <p class="text-xs text-gray-500">匯入資金與線上匯款回饋</p>
      </div>
      <div class="bg-gray-50 p-4 rounded-lg">
        <p class="text-gray-400">目前總資產價值</p>
        <h2 id="asset_total" class="text-xl font-bold">-</h2>
        <p class="text-xs text-gray-500">
          現金: <span id="asset_cash">-</span> / 融資: <span id="asset_margin">-</span>
        </p>
      </div>
    </div>
  </div>

  <!-- 健康分數條 -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <p class="mb-2 text-gray-500">健康分數</p>
    <div class="w-full bg-gray-200 rounded-full h-4">
      <div id="scoreBar" class="h-4 rounded-full bg-blue-500" style="width:0%"></div>
    </div>
  </div>

  <!-- Timeframe and Charts -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <h3 class="font-semibold">績效曲線</h3>
      <div class="space-x-2">
        <button class="period-btn px-3 py-1 rounded bg-blue-600 text-white" data-period="daily">日</button>
        <button class="period-btn px-3 py-1 rounded bg-gray-200" data-period="weekly">週</button>
        <button class="period-btn px-3 py-1 rounded bg-gray-200" data-period="monthly">月</button>
      </div>
    </div>
    <canvas id="equityChart"></canvas>
  </div>

  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h3 class="mb-4 font-semibold">回撤（Drawdown）</h3>
    <canvas id="drawdownChart"></canvas>
  </div>

  <!-- PnL Chart -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h3 class="mb-4 font-semibold">已實現損益（交易序列）</h3>
    <canvas id="pnlChart"></canvas>
  </div>

  <!-- Reconciliation -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h3 class="mb-4 font-semibold">對帳檢查</h3>
    <div class="grid grid-cols-2 gap-4 text-sm text-gray-700">
      <div>買入金額合計: <span id="rec_buy">-</span></div>
      <div>賣出金額合計: <span id="rec_sell">-</span></div>
      <div>現金流合計: <span id="rec_cashflow">-</span></div>
      <div>剩餘成本: <span id="rec_cost">-</span></div>
      <div>已實現損益合計: <span id="rec_realized">-</span></div>
      <div>預期已實現: <span id="rec_expected">-</span></div>
      <div>差異 (delta): <span id="rec_delta">-</span></div>
      <div>狀態: <span id="rec_status">-</span></div>
    </div>
  </div>

  <!-- Insights -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h3 class="mb-4 font-semibold">📌 分析建議</h3>
    <ul id="insights" class="list-disc pl-5 text-gray-700"></ul>
  </div>

<script>
fetch('./output.json')
  .then(res => res.json())
  .then(data => {

    const health = data.health;
    const formatNumber = (value) => Number(value || 0).toFixed(2);

    // KPI
    document.getElementById('total').innerText = health.total.toFixed(2);
    document.getElementById('win_rate').innerText = (health.win_rate * 100).toFixed(1) + "%";
    document.getElementById('pf').innerText = health.profit_factor.toFixed(2);
    document.getElementById('score').innerText = health.score;

    // Score bar
    document.getElementById('scoreBar').style.width = health.score + "%";

    // 資產概況
    const invested = data.invested_cost;
    if (invested && invested.enabled) {
      document.getElementById('invested').innerText = formatNumber(invested.total);
    } else {
      document.getElementById('invested').innerText = 'N/A';
    }

    const assetValue = data.asset_value;
    if (assetValue && assetValue.enabled) {
      const totals = assetValue.total_by_account || {};
      const cashValue = totals['現金'] || 0;
      const marginValue = totals['融資'] || 0;
      const totalValue = assetValue.total || (cashValue + marginValue);
      document.getElementById('asset_total').innerText = formatNumber(totalValue);
      document.getElementById('asset_cash').innerText = formatNumber(cashValue);
      document.getElementById('asset_margin').innerText = formatNumber(marginValue);
    } else {
      document.getElementById('asset_total').innerText = 'N/A';
      document.getElementById('asset_cash').innerText = 'N/A';
      document.getElementById('asset_margin').innerText = 'N/A';
    }

    // Insights（簡單規則）
    const insights = [];

    if (health.win_rate < 0.5) insights.push("⚠️ 勝率偏低");
    if (health.profit_factor < 1) insights.push("⚠️ 賺小賠大");
    if (health.score > 70) insights.push("✅ 整體表現穩健");

    const ul = document.getElementById('insights');
    insights.forEach(i => {
      const li = document.createElement('li');
      li.innerText = i;
      ul.appendChild(li);
    });

    const timeseries = data.timeseries || {};
    let equityChart = null;
    let drawdownChart = null;

    const periodButtons = document.querySelectorAll('.period-btn');

    const colorMap = {
      '現金': '#2563eb',
      '融資': '#16a34a',
      'unknown': '#6b7280'
    };

    const buildAccountSeries = (series) => {
      const accountSet = new Set();
      series.forEach(item => {
        const byAccount = item.by_account || {};
        Object.keys(byAccount).forEach(key => accountSet.add(key));
      });

      const accounts = Array.from(accountSet);
      const running = {};
      const cumulative = {};
      accounts.forEach(key => {
        running[key] = 0;
        cumulative[key] = [];
      });

      series.forEach(item => {
        const byAccount = item.by_account || {};
        accounts.forEach(key => {
          running[key] += Number(byAccount[key] || 0);
          cumulative[key].push(running[key]);
        });
      });

      return { accounts, cumulative };
    };

    const renderTimeseries = (period) => {
      const series = timeseries[period] || [];
      const labels = series.map(item => item.date);
      const totalCumulative = series.map(item => item.cumulative_total || 0);
      const drawdown = series.map(item => item.drawdown || 0);
      const maxDrawdown = (timeseries.max_drawdown || {})[period] || 0;

      document.getElementById('max_drawdown').innerText = formatNumber(maxDrawdown);

      const accountSeries = buildAccountSeries(series);
      const datasets = [
        {
          label: 'Total',
          data: totalCumulative,
          borderColor: '#111827',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        }
      ];

      accountSeries.accounts.forEach(key => {
        datasets.push({
          label: key,
          data: accountSeries.cumulative[key],
          borderColor: colorMap[key] || '#9ca3af',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        });
      });

      if (equityChart) {
        equityChart.data.labels = labels;
        equityChart.data.datasets = datasets;
        equityChart.update();
      } else {
        equityChart = new Chart(document.getElementById('equityChart'), {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            scales: { y: { ticks: { callback: (v) => v } } }
          }
        });
      }

      if (drawdownChart) {
        drawdownChart.data.labels = labels;
        drawdownChart.data.datasets[0].data = drawdown;
        drawdownChart.update();
      } else {
        drawdownChart = new Chart(document.getElementById('drawdownChart'), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Drawdown',
              data: drawdown,
              borderColor: '#dc2626',
              backgroundColor: 'rgba(220,38,38,0.2)',
              fill: true,
              pointRadius: 0,
              tension: 0.2
            }]
          },
          options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false }
          }
        });
      }
    };

    periodButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        periodButtons.forEach(b => {
          b.classList.remove('bg-blue-600', 'text-white');
          b.classList.add('bg-gray-200');
        });
        btn.classList.remove('bg-gray-200');
        btn.classList.add('bg-blue-600', 'text-white');
        renderTimeseries(btn.dataset.period);
      });
    });

    renderTimeseries('daily');

    // PnL Chart
    const pnlData = data.realized.map((x, i) => ({
      x: i,
      y: x.pnl
    }));

    const ctx = document.getElementById('pnlChart');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: pnlData.map(d => d.x),
        datasets: [{
          label: 'PnL',
          data: pnlData.map(d => d.y),
          borderWidth: 2
        }]
      }
    });

    // Reconciliation
    const rec = data.reconciliation;
    if (rec && rec.enabled) {
      document.getElementById('rec_buy').innerText = rec.total_buy_amount.toFixed(2);
      document.getElementById('rec_sell').innerText = rec.total_sell_amount.toFixed(2);
      document.getElementById('rec_cashflow').innerText = rec.net_cashflow.toFixed(2);
      document.getElementById('rec_cost').innerText = rec.remaining_cost_basis.toFixed(2);
      document.getElementById('rec_realized').innerText = rec.realized_total.toFixed(2);
      document.getElementById('rec_expected').innerText = rec.expected_realized.toFixed(2);
      document.getElementById('rec_delta').innerText = rec.delta.toFixed(2);
      document.getElementById('rec_status').innerText = Math.abs(rec.delta) < 0.01 ? 'OK' : 'CHECK';
    } else {
      document.getElementById('rec_status').innerText = 'N/A';
    }

  })
  .catch(err => {
    console.error(err);
    alert("讀取資料失敗，請確認 GitHub Actions 是否已執行");
  });
</script>

</body>
</html>
