name: Run Analysis

permissions:
  contents: write
  models: read

on:
  workflow_dispatch:
  schedule:
    # 07:00 Asia/Taipei, after the previous US regular session has settled.
    - cron: "0 23 * * 1-5"
  push:
    paths:
      - "data/transactions.csv"
      - "data/*-positions.xlsx"
      - "scripts/*.py"
      - ".github/workflows/analyze.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas numpy openpyxl yfinance

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GITHUB_TOKEN }}
          LLM_API_URL: ${{ secrets.LLM_API_URL || 'https://models.github.ai/inference/chat/completions' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'openai/gpt-4o-mini' }}
          LLM_TEMPERATURE: ${{ secrets.LLM_TEMPERATURE }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS }}
          LLM_TIMEOUT: ${{ secrets.LLM_TIMEOUT }}
          LLM_HTTP_REFERER: ${{ secrets.LLM_HTTP_REFERER }}
          LLM_APP_TITLE: ${{ secrets.LLM_APP_TITLE }}
          DAILY_EMAIL_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX }}
          EMAIL_FAIL_ON_ERROR: ${{ secrets.EMAIL_FAIL_ON_ERROR }}
        run: python scripts/analyze.py

      - name: Sync outputs to docs
        run: |
          mkdir -p docs
          cp data/output.json docs/output.json

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/output.json data/report.html docs/output.json
          git commit -m "update analysis" || echo "no changes"
          git push
